[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pylora"
version = "0.1.0"
description = "A simple implementation of LoRA in PyTorch"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch"]
license = "GPL-2.0-only"
license-files = ["LICENSE"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
py-modules = ["pylora"]

[tool.pylint.main]
py-version = "3.9"

[tool.pylint.messages_control]
disable = [
    "arguments-differ",
    "arguments-renamed",
    "consider-using-from-import",
    "invalid-name",
    "protected-access",
    "too-many-arguments",
    "too-many-locals",
    "too-many-positional-arguments",
]
